<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Konversi ke Markdown</title>
    <style>
      :root {
        --bg: #eef1f4;
        --card: #fff;
        --ink: #22303c;
        --muted: #5e6b78;
        --line: #c9d1d9;
        --accent: #2f55d4;
        --err: #b3261e;
        --ok: #1f7a55;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161b21;
          --card: #1e252d;
          --ink: #e4e9ee;
          --muted: #9aa6b2;
          --line: #34404c;
          --accent: #7d9bff;
          --err: #f2847b;
          --ok: #5fcb9a;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        display: grid;
        place-items: center;
        padding: 1.25rem;
      }
      .box {
        width: 100%;
        max-width: 460px;
        background: var(--card);
        border: 2px dashed var(--line);
        border-radius: 16px;
        padding: 2.5rem 1.5rem;
        text-align: center;
        cursor: pointer;
      }
      .box:hover,
      .box.over {
        border-color: var(--accent);
      }
      .box:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      .box.off {
        cursor: progress;
        opacity: 0.7;
      }
      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.35rem;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      #msg {
        margin-top: 1.25rem;
        font-weight: 500;
        color: var(--ink);
      }
      #msg.err {
        color: var(--err);
      }
      #msg.ok {
        color: var(--ok);
      }
      #msg {
        white-space: pre-line;
      }
      progress {
        width: 100%;
        margin-top: 0.75rem;
        accent-color: var(--accent);
      }
      progress[hidden] {
        display: none;
      }
      #warn {
        margin-top: 0.75rem;
        font-size: 0.875rem;
        color: var(--err);
      }
      input {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="box" class="box off" tabindex="0" role="button">
      <h1>Pilih atau tarik file ke sini</h1>
      <p>PDF, Word, PowerPoint, Excel, HTML, CSV, dan lainnya</p>
      <p id="msg" aria-live="polite">Menyiapkan halaman…</p>
      <progress id="bar" max="1" value="0"></progress>
      <p id="warn" hidden></p>
      <input
        id="f"
        type="file"
        multiple
        accept=".pdf,.docx,.pptx,.xlsx,.xls,.html,.htm,.csv,.json,.xml,.txt,.epub,.zip"
      />
    </div>

    <script type="text/worker" id="worker-src">
      const BASE = "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/";
      importScripts(BASE + "pyodide.js");
      let py = null, convert = null;
      const post = (m) => self.postMessage(m);
      const step = (n, t) => post({ type: "progress", step: n, total: 4, text: t });

      function errText(e) {
        const lines = String((e && e.message) || e || "")
          .trim()
          .split("\n")
          .map((l) => l.trim())
          .filter(Boolean);
        let last = lines.pop() || "Kesalahan tidak diketahui";
        if (last.includes("etc.") && lines.length) last = lines.pop();
        return last;
      }

      async function boot() {
        step(1, "Memuat Python (WebAssembly)…");
        py = await loadPyodide({ indexURL: BASE });
        step(2, "Memuat paket inti (lxml, pandas, …)…");
        await py.loadPackage(["micropip", "lxml", "pandas", "pillow", "cryptography"]);
        step(3, "Memasang dependensi MarkItDown…");
        const failed = await py.runPythonAsync(`
import sys, types, asyncio
m=types.ModuleType("magika")
class R: status="error"; prediction=None
class Magika:
    def __init__(s,*a,**k): pass
    def identify_stream(s,*a,**k): return R()
    def identify_bytes(s,*a,**k): return R()
    def identify_path(s,*a,**k): return R()
m.Magika=Magika; sys.modules["magika"]=m
import micropip
pkgs=["markdownify","defusedxml","pdfminer.six","mammoth","python-pptx","openpyxl","xlrd","requests","charset-normalizer","beautifulsoup4","olefile","cobble"]
res=await asyncio.gather(*[micropip.install(p) for p in pkgs],return_exceptions=True)
failed=[p for p,r in zip(pkgs,res) if isinstance(r,BaseException)]
",".join(failed)
`);
        step(4, "Memasang MarkItDown…");
        await py.runPythonAsync(`
import micropip
# 0.1.5+ butuh pdfplumber (pypdfium2 native), tidak jalan di Pyodide
await micropip.install("markitdown==0.1.4",deps=False)
from markitdown import MarkItDown
_md=MarkItDown(enable_plugins=False)
def convert_file(p): return _md.convert(p).text_content
`);
        convert = py.globals.get("convert_file");
        post({ type: "ready", failed: failed ? failed.split(",") : [] });
      }

      self.onmessage = ({ data }) => {
        const { id, name, buf } = data;
        const path = "/tmp/" + id + "_" + name.replace(/[\/\\]/g, "_");
        try {
          py.FS.writeFile(path, new Uint8Array(buf));
          post({ type: "done", id, text: convert(path) });
        } catch (e) {
          post({ type: "fail", id, error: errText(e) });
        } finally {
          try { py.FS.unlink(path); } catch (_) {}
        }
      };

      boot().catch((e) => post({ type: "bootfail", error: errText(e) }));
    </script>
    <script>
      const box = document.getElementById("box"),
        input = document.getElementById("f"),
        msg = document.getElementById("msg"),
        bar = document.getElementById("bar"),
        warn = document.getElementById("warn");
      let ready = false,
        busy = false,
        seq = 0;
      const queue = [],
        pending = new Map();
      const say = (t, c = "") => {
        msg.textContent = t;
        msg.className = c;
      };
      const setBar = (v) => {
        bar.hidden = v == null;
        if (v != null) bar.value = v;
      };

      const worker = new Worker(
        URL.createObjectURL(
          new Blob([document.getElementById("worker-src").textContent], {
            type: "text/javascript",
          }),
        ),
      );

      worker.onmessage = ({ data: m }) => {
        if (m.type === "progress") {
          say(`(${m.step}/${m.total}) ${m.text}`);
          setBar((m.step - 1) / m.total);
        } else if (m.type === "ready") {
          ready = true;
          setBar(null);
          box.classList.remove("off");
          say("Siap. Pilih satu atau beberapa file.");
          if (m.failed.length) {
            warn.hidden = false;
            warn.textContent =
              "Peringatan: paket gagal dipasang (" +
              m.failed.join(", ") +
              "). Beberapa format mungkin tidak bisa dikonversi.";
          }
        } else if (m.type === "bootfail") {
          setBar(null);
          say("Halaman gagal dimuat: " + m.error + ". Muat ulang dan coba lagi.", "err");
        } else {
          const cb = pending.get(m.id);
          pending.delete(m.id);
          cb && cb(m);
        }
      };
      worker.onerror = (e) => {
        console.error(e);
        say("Halaman gagal dimuat. Muat ulang dan coba lagi.", "err");
      };

      const convert = (file) =>
        file.arrayBuffer().then(
          (buf) =>
            new Promise((resolve) => {
              const id = ++seq;
              pending.set(id, resolve);
              worker.postMessage({ id, name: file.name, buf }, [buf]);
            }),
        );

      function download(name, text) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(
          new Blob([text], { type: "text/markdown;charset=utf-8" }),
        );
        a.download = name.replace(/\.[^.]+$/, "") + ".md";
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }

      async function enqueue(files) {
        queue.push(...files);
        if (!ready || busy || !queue.length) return;
        busy = true;
        box.classList.add("off");
        const errors = [];
        let ok = 0,
          total = 0;
        while (queue.length) {
          const file = queue.shift();
          total++;
          say(`Mengonversi ${file.name}… (${total}/${total + queue.length})`);
          setBar((total - 1) / (total + queue.length));
          try {
            const r = await convert(file);
            if (r.type === "done") {
              download(file.name, r.text);
              ok++;
            } else errors.push(file.name + ": " + r.error);
          } catch (e) {
            errors.push(file.name + ": " + (e.message || String(e)));
          }
        }
        setBar(null);
        if (!errors.length)
          say(total > 1 ? `Selesai, ${ok} file .md sudah terunduh.` : "Selesai, file .md sudah terunduh.", "ok");
        else
          say(
            (ok ? `${ok} berhasil, ` : "") + `${errors.length} gagal:\n` + errors.join("\n"),
            "err",
          );
        busy = false;
        box.classList.remove("off");
      }

      box.onclick = () => {
        if (ready && !busy) input.click();
      };
      box.onkeydown = (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          box.click();
        }
      };
      input.onchange = () => {
        enqueue([...input.files]);
        input.value = "";
      };
      ["dragenter", "dragover"].forEach((t) =>
        box.addEventListener(t, (e) => {
          e.preventDefault();
          box.classList.add("over");
        }),
      );
      ["dragleave", "drop"].forEach((t) =>
        box.addEventListener(t, (e) => {
          e.preventDefault();
          box.classList.remove("over");
        }),
      );
      box.addEventListener("drop", (e) => {
        if (ready && !busy) enqueue([...e.dataTransfer.files]);
      });
    </script>
  </body>
</html>
